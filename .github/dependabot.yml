version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 15 * *"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker-compose"
    directory: "/.github/e2e"
    schedule:
      interval: cron
      cronjob: "0 0 15 * *"
    cooldown:
      default-days: 7
