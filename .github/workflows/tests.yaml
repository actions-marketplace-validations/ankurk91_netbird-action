name: tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 16 * *'
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A real NetBird server, so the action registers a real peer and gets a
      # real network map back - the parts no amount of mocking would cover.
      - name: Start a throwaway NetBird server
        id: server
        run: bash .github/e2e/start-server.sh

      - name: Join the network using this action
        id: netbird
        uses: ./
        with:
          setup-key: ${{ steps.server.outputs.setup-key }}
          management-url: http://localhost:8081
          diagnostics: true

      - name: Assert the runner joined
        env:
          NETBIRD_IP: ${{ steps.netbird.outputs.netbird-ip }}
          NETBIRD_PAT: ${{ steps.server.outputs.pat }}
          PEER_NAME: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .github/e2e/assert-connected.sh

      # Runs the action's own DNS wait against this network, so the input is
      # exercised against a real resolver rather than only a stubbed one.
      - name: Assert the DNS wait works here
        env:
          NETBIRD_IP: ${{ steps.netbird.outputs.netbird-ip }}
        run: bash .github/e2e/assert-dns-check.sh

      # Runs while the throwaway server is still up, so the assertion can ask it
      # whether the peer is really gone rather than only asking the client.
      - name: Assert the cleanup took the runner back off
        env:
          NETBIRD_IP: ${{ steps.netbird.outputs.netbird-ip }}
          NETBIRD_PAT: ${{ steps.server.outputs.pat }}
        run: bash .github/e2e/assert-cleaned.sh

      - name: Show the server side
        if: always()
        run: docker logs --tail 100 netbird-server

      - name: Remove the server
        if: always()
        run: docker rm --force netbird-server

  # Runs src/dns-check.sh against a stubbed resolver, for the answers a live
  # network cannot be made to give and for input that never reaches DNS.
  dns-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the dns-check cases
        run: bash .github/e2e/test-dns-check.sh

  # The e2e job connects with no extra flags, so a flag list that lost entries on
  # the way to the client would still connect and still pass there. Stubbing the
  # client is the only way to see the argument list it was really given.
  connect-args:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the connect args cases
        run: bash .github/e2e/test-connect-args.sh

  # The e2e job above always installs whatever is newest, so the 'version' input
  # only gets exercised here. One architecture is enough: this is about which
  # release the script asks for, not about the binary it gets back.
  install:
    name: install (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # Nothing asked for, so the newest release is what has to land.
          - name: 'no version'
            version: ''
            expected: ''
          # A real release that is not the newest, so a pass means the pin was
          # honoured rather than quietly ignored.
          - name: 'pinned'
            version: '0.77.1'
            expected: '0.77.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the install script on its own
        env:
          INPUT_VERSION: ${{ matrix.version }}
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: bash src/install.sh

      - name: Assert the version that landed
        env:
          EXPECTED_VERSION: ${{ matrix.expected }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/e2e/assert-install.sh
