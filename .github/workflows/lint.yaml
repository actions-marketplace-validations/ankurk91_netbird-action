name: lint

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 16 * *'
  push:
    branches:
      - main
      - dev
    paths:
      - '**.sh'
      - '**.mjs'
      - 'action.yaml'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**.sh'
      - '**.mjs'
      - 'action.yaml'
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the sh-checker
        uses: luizm/action-sh-checker@v0.10.0
        with:
          sh_checker_checkbashisms_enable: true
          sh_checker_shfmt_disable: true

      # The action's entry points. Nothing here is bundled or has dependencies,
      # so parsing them is the whole of what there is to check.
      - name: Check the JavaScript parses
        run: node --check src/main.mjs && node --check src/post.mjs

      # The image bundles shellcheck; `-pyflakes=` turns off the Python check.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -pyflakes=
