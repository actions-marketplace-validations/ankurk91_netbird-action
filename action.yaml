name: 'Setup NetBird'
description: 'Install the NetBird client on an Ubuntu runner and join your network with a setup key.'
author: 'ankurk91'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  setup-key:
    description: 'Setup key from the NetBird dashboard, used to register the runner as a peer. Always pass this from a secret.'
    required: true
  management-url:
    description: 'Management service URL [http|https]://[host]:[port]. Set this when you self-host NetBird.'
    required: false
    default: 'https://api.netbird.io:443'
  peer-name:
    description: 'Peer name shown in the NetBird dashboard.'
    required: false
    default: 'gh-${{ github.run_id }}-${{ github.run_attempt }}'
  exit-node:
    description: 'Network (route) ID to send traffic through once connected. Empty leaves the distributed routes as they are.'
    required: false
    default: ''
  dns-hostnames:
    description: 'Hostnames that must resolve before the action finishes, separated by commas or whitespace. Empty skips the check.'
    required: false
    default: ''
  dns-require-private:
    description: 'Reject a `dns-hostnames` answer that is publicly routable, in either address family - so every address must be in the NetBird range 100.64.0.0/10, RFC 1918, or IPv6 unique local fc00::/7. Set this false for a name that legitimately answers with a public address, such as one reached through an exit node.'
    required: false
    default: 'true'
  args:
    description: 'Extra flags appended to `netbird up`, split on whitespace - one per line works.'
    required: false
    default: ''
  version:
    description: 'NetBird client release to install, such as 0.78.1. Must be 0.67.0 or newer. Defaults to the newest release.'
    required: false
    default: 'latest'
  github-token:
    description: 'Raises the GitHub API rate limit while resolving a pinned `version`. Sent only when `version` is pinned. Pass an empty string to withhold it.'
    required: false
    default: ${{ github.token }}
  timeout:
    description: 'Seconds allowed for each wait: the peer connecting, the exit node route reaching it, and the `dns-hostnames` resolving. The names share the third between them rather than getting one each.'
    required: false
    default: '60'
  cleanup:
    description: 'Deregister the peer and undo the install when the job ends. Off by default: a hosted runner is discarded anyway, and an ephemeral setup key drops the peer from the dashboard on its own. Turn it on for self-hosted runners, whose machine outlives the job.'
    required: false
    default: 'false'
  diagnostics:
    description: 'Print the peer state to the job log: netbird status, the routes and the public IP before and after connecting. Off by default.'
    required: false
    default: 'false'

outputs:
  netbird-ip:
    description: "The runner's IPv4 address inside the NetBird network, e.g. 100.64.0.33."

runs:
  using: 'node24'
  main: 'src/main.mjs'
  post: 'src/post.mjs'
